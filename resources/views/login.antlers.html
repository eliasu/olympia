<div class="max-w-md mx-auto px-4 sm:px-6 py-24">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-[2rem] shadow-xl border border-gray-100 dark:border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-gray-900 dark:text-white tracking-tighter">Welcome Back</h1>
            <p class="text-sm font-bold text-gray-500 mt-2">Log in to manage your profile and view your games.</p>
        </div>

        {{ user:login_form redirect="/" }}
            {{ if errors }}
                <div class="bg-red-50 dark:bg-red-900/30 border-l-4 border-red-500 p-4 mb-6 rounded-r-xl">
                    <div class="flex items-center gap-3">
                        <svg class="h-5 w-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                        <ul class="text-sm font-bold text-red-700 dark:text-red-400 m-0">
                            {{ errors }}
                                <li>{{ value }}</li>
                            {{ /errors }}
                        </ul>
                    </div>
                </div>
            {{ /if }}

            <div class="space-y-5">
                <div>
                    <label for="email" class="block text-xs font-black uppercase tracking-widest text-gray-500 mb-2">Email Address</label>
                    <input type="email" name="email" id="email" value="{{ old:email }}" required
                        class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-gray-900 dark:text-white font-bold focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none"
                        placeholder="player@example.com">
                </div>

                <div>
                    <label for="password" class="block text-xs font-black uppercase tracking-widest text-gray-500 mb-2">Password</label>
                    <input type="password" name="password" id="password" required
                        class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-gray-900 dark:text-white font-bold focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none"
                        placeholder="••••••••">
                </div>

                <div class="pt-2">
                    <button type="submit" 
                        class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-black uppercase tracking-widest transition-all transform hover:-translate-y-1 hover:shadow-lg hover:shadow-indigo-500/30 active:translate-y-0 active:shadow-md">
                        Log In
                    </button>
                </div>
            </div>
        {{ /user:login_form }}
    </div>
</div>
