title: User
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              validate:
                - required
          -
            handle: email
            field:
              type: text
              input_type: email
              display: 'Email Address'
              listable: true
              input: email
          -
            handle: roles
            field:
              type: user_roles
              mode: select
              width: 50
              listable: true
              filterable: false
          -
            handle: groups
            field:
              type: user_groups
              mode: select
              width: 50
              listable: true
              filterable: false
          -
            handle: avatar
            field:
              type: assets
              max_files: 1
              container: assets
              display: Avatar
              instructions: 'Upload a profile photo (max 1MB, images only)'
              validate:
                - 'max:1024'
                - 'mimes:jpg,jpeg,png,gif,webp'
              folder: profile-pictures
          -
            handle: player_section
            field:
              type: section
              display: 'Player Stats'
          -
            handle: global_elo
            field:
              type: float
              default: 1500
              display: 'Global Elo'
              width: 33
          -
            handle: player_status
            field:
              type: select
              options:
                active: Active
                inactive: Inactive
              default: active
              display: 'Player Status'
              width: 33
          -
            handle: total_games
            field:
              type: integer
              default: 0
              display: 'Total Games'
              width: 33
          -
            handle: wins
            field:
              type: integer
              default: 0
              display: Wins
              width: 33
          -
            handle: losses
            field:
              type: integer
              default: 0
              display: Losses
              width: 33
  league_stats:
    display: 'League Stats'
    sections:
      -
        fields:
          -
            handle: league_stats
            field:
              type: grid
              display: 'League Stats'
              visibility: read_only
              reorderable: false
              add_row: false
              delete_row: false
              fields:
                -
                  handle: league
                  field:
                    type: entries
                    collections:
                      - leagues
                    max_items: 1
                    display: League
                -
                  handle: played_gamedays
                  field:
                    type: integer
                    display: 'Played Days'
                -
                  handle: match_count
                  field:
                    type: integer
                    display: 'Match Count'
                    default: 0
                -
                  handle: league_wins
                  field:
                    type: integer
                    display: Wins
                    default: 0
                -
                  handle: league_losses
                  field:
                    type: integer
                    display: Losses
                    default: 0
                -
                  handle: win_percentage
                  field:
                    type: float
                    display: 'Win %'
                -
                  handle: rank
                  field:
                    type: integer
                    display: Rank
  matches:
    display: Matches
    sections:
      -
        fields:
          -
            handle: matches
            field:
              type: entries
              collections:
                - matches
              display: Matches
              listable: true
              visibility: read_only
  elo_history:
    display: 'Elo History'
    sections:
      -
        fields:
          -
            handle: elo_history
            field:
              type: grid
              display: 'Elo History'
              instructions: 'Historical Elo progression for charts'
              visibility: read_only
              reorderable: false
              add_row: false
              delete_row: false
              fields:
                -
                  handle: date
                  field:
                    type: date
                    display: Date
                    time_enabled: true
                -
                  handle: elo
                  field:
                    type: float
                    display: 'Elo Rating'
                -
                  handle: match
                  field:
                    type: text
                    display: 'Match ID'
                -
                  handle: league
                  field:
                    type: text
                    display: 'League ID'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              from: name
              display: Slug
              instructions: 'Used for profile URL (/players/{slug}).'
              validate: 'max:200'
